<!DOCTYPE html>
<html lang="{{.Lang}}" dir="{{.Dir}}" x-data="app">

<head>
  <title>{{ T "app.title" }}</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    (() => {
      let stored = null;
      try {
        stored = localStorage.getItem("theme");
      } catch {}
      const dark = stored ? stored === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.classList.toggle("dark", dark);
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@4/dist/htmx.min.js"></script>
  <script defer src="/static/js/app.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="/static/css/style.css" />
</head>

<body class="min-h-screen bg-app-bg text-app-text transition-colors">
  <main class="mx-auto w-full max-w-2xl px-4 py-10 sm:px-6 sm:py-16">
    <header class="mb-8 flex items-start justify-between gap-4">
      <div class="min-w-0">
        <p class="text-xs font-medium uppercase tracking-[0.24em] text-app-subtle">{{ T "app.personal" }}</p>
        <h1 class="mt-2 text-3xl font-semibold tracking-tight text-app-text sm:text-4xl">{{ T "app.heading" }}</h1>
        <p class="mt-2 text-sm text-app-muted">{{ T "app.tagline" }}</p>
      </div>

      <div class="flex shrink-0 items-center gap-1.5">
        <button type="button"
                @click="toggleTheme()"
                :aria-pressed="theme === 'dark'"
                aria-label="{{ T "theme.toggle" }}"
                title="{{ T "theme.toggle" }}"
                class="inline-flex h-9 w-9 items-center justify-center rounded-lg border border-app-border bg-app-surface/70 text-app-muted transition hover:bg-app-panel hover:text-app-text focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-app-accent focus-visible:ring-offset-2 focus-visible:ring-offset-app-bg">
          <svg x-show="theme === 'light'" x-cloak class="h-4 w-4" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <circle cx="8" cy="8" r="2.75" stroke="currentColor" stroke-width="1.25" />
            <path d="M8 1.5v1.25M8 13.25v1.25M1.5 8h1.25M13.25 8h1.25M3.4 3.4l.9.9M11.7 11.7l.9.9M12.6 3.4l-.9.9M4.3 11.7l-.9.9" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" />
          </svg>
          <svg x-show="theme === 'dark'" x-cloak class="h-4 w-4" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M13.25 9.5A5.75 5.75 0 0 1 6.5 2.75a5.75 5.75 0 1 0 6.75 6.75Z" stroke="currentColor" stroke-width="1.25" stroke-linejoin="round" />
          </svg>
        </button>

        <button type="button"
                @click="setLang('{{if eq .Lang "ar"}}en{{else}}ar{{end}}')"
                aria-label="{{ if eq .Lang "ar" }}{{ T "language.switch_to_english" }}{{ else }}{{ T "language.switch_to_arabic" }}{{ end }}"
                class="inline-flex h-9 items-center justify-center rounded-lg border border-app-border bg-app-surface/70 px-3 text-xs font-semibold text-app-muted transition hover:bg-app-panel hover:text-app-text focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-app-accent focus-visible:ring-offset-2 focus-visible:ring-offset-app-bg">
          {{ if eq .Lang "ar" }}{{ T "language.english" }}{{ else }}{{ T "language.arabic" }}{{ end }}
        </button>
      </div>
    </header>

    <section aria-labelledby="add-heading">
      <h2 id="add-heading" class="sr-only">{{ T "add.heading" }}</h2>

      <form class="flex items-center gap-2 rounded-xl border border-app-border bg-app-surface/70 p-1.5 transition focus-within:border-app-accent focus-within:ring-2 focus-within:ring-app-accent/20"
            hx-post="/todos"
            hx-target="#todo-list"
            hx-swap="beforeend"
            hx-include="#filter-form"
            hx-indicator="#add-indicator"
            hx-on:htmx:after:request="if(event.detail.ctx.response.status < 400) this.reset()"
            hx-status:4xx="target:#form-error"
            hx-status:5xx="target:#form-error">
        <label for="description" class="sr-only">{{ T "add.description_label" }}</label>
        <input id="description"
               type="text"
               name="description"
               placeholder="{{ T "add.placeholder" }}"
               autocomplete="off"
               maxlength="5000"
               required
               aria-describedby="form-error"
               class="min-w-0 flex-1 border-0 bg-transparent px-3 py-2 text-base text-app-text placeholder:text-app-subtle focus:ring-0 sm:text-sm">
        <button type="submit"
                class="inline-flex shrink-0 items-center gap-2 rounded-lg bg-app-accent px-4 py-2 text-sm font-medium text-white transition hover:bg-app-accent-strong focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-app-accent focus-visible:ring-offset-2 focus-visible:ring-offset-app-bg">
          {{ T "add.button" }}
          <span id="add-indicator"
                class="htmx-indicator h-3.5 w-3.5 rounded-full border-2 border-white/40 border-t-white animate-spin"
                aria-hidden="true"></span>
        </button>
      </form>

      <div id="form-error"
           class="mt-2 min-h-5 text-sm font-medium text-app-danger"
           role="alert"
           aria-live="polite"></div>
    </section>

    <section id="todo-panel"
             data-loaded="false"
             class="mt-6 overflow-hidden rounded-2xl border border-app-border bg-app-surface/60"
             aria-labelledby="list-heading">
      <div class="flex flex-col gap-3 border-b border-app-border px-4 py-3 sm:flex-row sm:items-center sm:justify-between sm:px-5">
        <h2 id="list-heading" class="text-sm font-semibold text-app-text">{{ T "list.heading" }}</h2>

        <form id="filter-form"
              class="flex items-center gap-1 rounded-lg bg-app-bg/70 p-1"
              hx-get="/todos"
              hx-target="#todo-list"
              hx-swap="innerHTML"
              hx-trigger="change"
              hx-indicator="#todo-loading"
              hx-status:4xx="target:#form-error"
              hx-status:5xx="target:#form-error"
              aria-label="{{ T "list.filter_label" }}">
          <label class="relative cursor-pointer">
            <input type="radio" name="filter" value="" checked class="peer sr-only">
            <span class="inline-flex rounded-md px-3 py-1.5 text-xs font-medium text-app-subtle transition peer-checked:bg-app-panel peer-checked:text-app-text peer-focus-visible:ring-2 peer-focus-visible:ring-app-accent">{{ T "list.filter_all" }}</span>
          </label>
          <label class="relative cursor-pointer">
            <input type="radio" name="filter" value="active" class="peer sr-only">
            <span class="inline-flex rounded-md px-3 py-1.5 text-xs font-medium text-app-subtle transition peer-checked:bg-app-panel peer-checked:text-app-text peer-focus-visible:ring-2 peer-focus-visible:ring-app-accent">{{ T "list.filter_active" }}</span>
          </label>
          <label class="relative cursor-pointer">
            <input type="radio" name="filter" value="completed" class="peer sr-only">
            <span class="inline-flex rounded-md px-3 py-1.5 text-xs font-medium text-app-subtle transition peer-checked:bg-app-panel peer-checked:text-app-text peer-focus-visible:ring-2 peer-focus-visible:ring-app-accent">{{ T "list.filter_completed" }}</span>
          </label>
        </form>
      </div>

      <div id="todo-loading"
           class="htmx-indicator items-center gap-2 border-b border-app-border px-4 py-2 text-xs text-app-muted sm:px-5"
           role="status">
        <span class="h-3 w-3 rounded-full border-2 border-app-border border-t-app-subtle animate-spin" aria-hidden="true"></span>
        {{ T "list.loading" }}
      </div>

      <ul id="todo-list"
          class="divide-y divide-app-border"
          hx-get="/todos"
          hx-include="#filter-form"
          hx-trigger="load"
          hx-swap="innerHTML"
          hx-indicator="#todo-loading"
          hx-on:htmx:after:request="if(event.detail.ctx.response.status < 400) this.parentElement.dataset.loaded = 'true'"
          hx-status:4xx="target:#form-error"
          hx-status:5xx="target:#form-error"></ul>

      <div id="todo-empty" class="flex flex-col items-center justify-center px-6 py-14 text-center">
        <span class="flex h-10 w-10 items-center justify-center rounded-full border border-app-border bg-app-panel text-app-subtle" aria-hidden="true">
          <svg class="h-4 w-4" viewBox="0 0 16 16" fill="none">
            <path d="M3 8.25 6.25 11.5 13 4.75" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </span>
        <p class="mt-3 text-sm font-medium text-app-muted">{{ T "list.empty_title" }}</p>
        <p class="mt-1 text-xs text-app-subtle">{{ T "list.empty_description" }}</p>
      </div>
    </section>
  </main>
</body>

</html>
