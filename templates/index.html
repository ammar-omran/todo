<!DOCTYPE html>
<html lang="en">

<head>
  <title>Todo</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@4/dist/htmx.min.js"></script>
  <link rel="stylesheet" href="/static/css/style.css" />
</head>

<body class="bg-gray-950">
  <main class="mx-auto max-w-7xl px-6 py-10">
    <h1 class="text-3xl font-bold text-white">Todo</h1>

    <form class="mt-4 flex flex-row items-center"
          hx-post="/todos"
          hx-target="#todo-list"
          hx-swap="append"
          hx-status:4xx="target:#form-error"
          hx-status:5xx="target:#form-error">
      <input type="text" name="description" placeholder="What needs to be done?" required
             class="w-full rounded border-0 bg-gray-950 px-4 py-2 text-white placeholder:text-gray-400">
      <button type="submit"
              class="rounded bg-teal-500 px-6 py-2 font-medium text-white hover:bg-teal-700">Add</button>
    </form>
    <div id="form-error" class="mt-2 text-sm font-medium text-white" role="alert"></div>

    <nav class="mt-4 flex flex-row items-center">
      <button hx-get="/todos" hx-target="#todo-list" hx-swap="innerHTML"
              class="rounded px-3 py-1 text-sm font-medium text-gray-300 hover:bg-teal-700">All</button>
      <button hx-get="/todos?status=active" hx-target="#todo-list" hx-swap="innerHTML"
              class="rounded px-3 py-1 text-sm font-medium text-gray-300 hover:bg-teal-700">Active</button>
      <button hx-get="/todos?status=completed" hx-target="#todo-list" hx-swap="innerHTML"
              class="rounded px-3 py-1 text-sm font-medium text-gray-300 hover:bg-teal-700">Completed</button>
    </nav>

    <div class="mt-4 flow-root">
      <div class="-mx-4 -my-2 overflow-x-auto sm:-mx-6 lg:-mx-8">
        <div class="inline-block min-w-full py-2 align-middle sm:px-6 lg:px-8">
          <table class="min-w-full divide-y divide-gray-700 table-auto">
            <thead>
              <tr>
                <th scope="col" class="px-3 py-3 text-left text-sm font-semibold text-white">Id</th>
                <th scope="col" class="px-3 py-3 text-left text-sm font-semibold text-white">Description</th>
                <th scope="col" class="px-3 py-3 text-left text-sm font-semibold text-white">Timestamp</th>
                <th scope="col" class="px-3 py-3 text-left text-sm font-semibold text-white">Actions</th>
              </tr>
            </thead>
            <tbody id="todo-list" class="divide-y divide-gray-800">
              {{template "todo-list" .Todos}}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
</body>

</html>
