{{if .}}
  {{range .}}{{template "todo-row" .}}{{end}}
{{else}}
<li class="flex flex-col items-center justify-center px-6 py-14 text-center">
  <span class="flex h-10 w-10 items-center justify-center rounded-full border border-slate-800 bg-slate-900 text-slate-500" aria-hidden="true">
    <svg class="h-4 w-4" viewBox="0 0 16 16" fill="none">
      <path d="M3 8.25 6.25 11.5 13 4.75" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
  </span>
  <p class="mt-3 text-sm font-medium text-slate-300">No tasks to show</p>
  <p class="mt-1 text-xs text-slate-500">Add a task above or try a different filter.</p>
</li>
{{end}}
