{{define "todo-row"}}
<li id="todo-{{.Id}}" class="group flex items-start gap-3 px-4 py-3.5 transition hover:bg-slate-900/60 sm:px-5">
  <button hx-patch="/todos/{{.Id}}"
          hx-swap="none"
          hx-status:4xx="target:#form-error"
          hx-status:5xx="target:#form-error"
          aria-label="{{if .Done}}Mark as active{{else}}Mark as complete{{end}}"
          class="mt-0.5 flex h-5 w-5 shrink-0 items-center justify-center rounded-full border transition focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-400 focus-visible:ring-offset-2 focus-visible:ring-offset-slate-950 {{if .Done}}border-indigo-400 bg-indigo-500 text-white hover:bg-indigo-400{{else}}border-slate-600 text-transparent hover:border-indigo-400 hover:text-indigo-400{{end}}">
    <svg class="h-3 w-3" viewBox="0 0 12 12" fill="none" aria-hidden="true">
      <path d="M2.5 6.25 4.75 8.5 9.5 3.75" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
  </button>

  <div class="min-w-0 flex-1">
    <p class="break-words text-sm leading-6 {{if .Done}}text-slate-500 line-through decoration-slate-600{{else}}text-slate-200{{end}}">{{.Description}}</p>
    <p class="mt-0.5 text-xs text-slate-500">{{.Created.Format "02 Jan 2006 · 15:04"}}</p>
  </div>

  <button hx-delete="/todos/{{.Id}}"
          hx-swap="none"
          hx-confirm="Delete this todo?"
          hx-status:4xx="target:#form-error"
          hx-status:5xx="target:#form-error"
          aria-label="Delete task"
          class="mt-0.5 inline-flex h-8 w-8 shrink-0 items-center justify-center rounded-lg text-slate-500 opacity-100 transition hover:bg-rose-500/10 hover:text-rose-400 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-rose-400 focus-visible:ring-offset-2 focus-visible:ring-offset-slate-950 sm:opacity-60 sm:group-hover:opacity-100 sm:focus-visible:opacity-100">
    <svg class="h-4 w-4" viewBox="0 0 16 16" fill="none" aria-hidden="true">
      <path d="M6.25 2.75h3.5M3.5 4.25h9M5 4.25l.5 8.25h5l.5-8.25M6.75 6.5v3.75M9.25 6.5v3.75" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
  </button>
</li>
{{end}}
