<!DOCTYPE html>
<html lang="en">

<head>
  <title>Todo</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@4/dist/htmx.min.js"></script>
  <link rel="stylesheet" href="/static/css/style.css" />
</head>

<body class="min-h-screen bg-slate-950 text-slate-100">
  <main class="mx-auto w-full max-w-2xl px-4 py-10 sm:px-6 sm:py-16">
    <header class="mb-8">
      <p class="text-xs font-medium uppercase tracking-[0.24em] text-slate-500">Personal</p>
      <h1 class="mt-2 text-3xl font-semibold tracking-tight text-white sm:text-4xl">Todo</h1>
      <p class="mt-2 text-sm text-slate-400">Keep the list short and the next step clear.</p>
    </header>

    <section aria-labelledby="add-heading">
      <h2 id="add-heading" class="sr-only">Add a task</h2>

      <form class="flex items-center gap-2 rounded-xl border border-slate-800 bg-slate-900/60 p-1.5 transition focus-within:border-indigo-500/60 focus-within:ring-2 focus-within:ring-indigo-500/20"
            hx-post="/todos"
            hx-swap="none"
            hx-indicator="#add-indicator"
            hx-on:htmx:after:request="if(event.detail.ctx.response.status < 400) this.reset()"
            hx-status:4xx="target:#form-error"
            hx-status:5xx="target:#form-error">
        <label for="description" class="sr-only">Task description</label>
        <input id="description"
               type="text"
               name="description"
               placeholder="What needs to be done?"
               autocomplete="off"
               maxlength="5000"
               required
               aria-describedby="form-error"
               class="min-w-0 flex-1 border-0 bg-transparent px-3 py-2 text-base text-slate-100 placeholder:text-slate-500 focus:ring-0 sm:text-sm">
        <button type="submit"
                class="inline-flex shrink-0 items-center gap-2 rounded-lg bg-indigo-500 px-4 py-2 text-sm font-medium text-white transition hover:bg-indigo-400 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-indigo-300 focus-visible:ring-offset-2 focus-visible:ring-offset-slate-950">
          Add
          <span id="add-indicator"
                class="htmx-indicator h-3.5 w-3.5 rounded-full border-2 border-white/40 border-t-white animate-spin"
                aria-hidden="true"></span>
        </button>
      </form>

      <div id="form-error"
           class="mt-2 min-h-5 text-sm font-medium text-rose-400"
           role="alert"
           aria-live="polite"></div>
    </section>

    <section class="mt-6 overflow-hidden rounded-2xl border border-slate-800 bg-slate-900/40"
             aria-labelledby="list-heading">
      <div class="flex flex-col gap-3 border-b border-slate-800 px-4 py-3 sm:flex-row sm:items-center sm:justify-between sm:px-5">
        <h2 id="list-heading" class="text-sm font-semibold text-white">Tasks</h2>

        <form id="filter-form"
              class="flex items-center gap-1 rounded-lg bg-slate-950/60 p-1"
              hx-get="/todos"
              hx-target="#todo-list"
              hx-swap="innerHTML"
              hx-trigger="change"
              hx-indicator="#todo-loading"
              hx-status:4xx="target:#form-error"
              hx-status:5xx="target:#form-error"
              aria-label="Filter tasks">
          <label class="relative cursor-pointer">
            <input type="radio" name="filter" value="" checked class="peer sr-only">
            <span class="inline-flex rounded-md px-3 py-1.5 text-xs font-medium text-slate-400 transition peer-checked:bg-slate-800 peer-checked:text-white peer-focus-visible:ring-2 peer-focus-visible:ring-indigo-400">All</span>
          </label>
          <label class="relative cursor-pointer">
            <input type="radio" name="filter" value="active" class="peer sr-only">
            <span class="inline-flex rounded-md px-3 py-1.5 text-xs font-medium text-slate-400 transition peer-checked:bg-slate-800 peer-checked:text-white peer-focus-visible:ring-2 peer-focus-visible:ring-indigo-400">Active</span>
          </label>
          <label class="relative cursor-pointer">
            <input type="radio" name="filter" value="completed" class="peer sr-only">
            <span class="inline-flex rounded-md px-3 py-1.5 text-xs font-medium text-slate-400 transition peer-checked:bg-slate-800 peer-checked:text-white peer-focus-visible:ring-2 peer-focus-visible:ring-indigo-400">Completed</span>
          </label>
        </form>
      </div>

      <div id="todo-loading"
           class="htmx-indicator items-center gap-2 border-b border-slate-800 px-4 py-2 text-xs text-slate-400 sm:px-5"
           role="status">
        <span class="h-3 w-3 rounded-full border-2 border-slate-600 border-t-slate-300 animate-spin" aria-hidden="true"></span>
        Loading tasks
      </div>

      <ul id="todo-list"
          class="divide-y divide-slate-800/80"
          hx-get="/todos"
          hx-include="#filter-form"
          hx-trigger="load, todos-changed from:body"
          hx-swap="innerHTML"
          hx-indicator="#todo-loading"
          hx-status:4xx="target:#form-error"
          hx-status:5xx="target:#form-error"></ul>
    </section>
  </main>
</body>

</html>
